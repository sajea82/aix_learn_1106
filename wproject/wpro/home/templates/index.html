<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인페이지</title>
    <script src="http://code.jquery.com/jquery-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        function sendBtn(){
            // input에 있는 데이터 가져오기
            const send_data = $('#data').val();
            console.log("데이터 : "+send_data);
            // views.py로 데이터 전달
            $.ajax({
                url:'/ajax_data/',
                type:'post',
                headers:{'X-CSRFToken':'{{csrf_token}}'},
                data:{'data':send_data},
                dataType:'json',
                success:function(data){  // result_data,result
                    alert('예측 데이터를 가져옵니다. 성공');
                    console.log(data)
                    // 예측무게 데이터
                    const chart_data = Number(data.result_data);
                    $('#result').text(send_data);
                    $('#result2').text(data.result_data);

                    //chart.js를 통해 그래프 생성
                    const ctx = document.getElementById('myChart');

                    let chartStatus = Chart.getChart("myChart");
                    if(chartStatus != undefined){
                        console.log("destroy success");
                        chartStatus.destroy(); //리셋
                    }

                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                        labels: ['예측무게'],
                        datasets: [{
                            label: '예측무게',
                            data: [chart_data],
                            borderWidth: 1,
                            barThickness: 50 // 막대두께 50px고정
                        }]
                        },
                        options: {
                        scales: {
                            y: {
                            beginAtZero: true
                            }
                        }
                        }
                    });

                },
                fail:function(){
                    alert('예측하는데 오류가 발생했습니다. 다시 시도해주세요.')
                }


            });
        }

    </script>
</head>
<body>
    <h1>메인페이지</h1>
    <div>
        <label> 길이,높이,넓이를 입력하세요.</label><br/>
        <input type='text' name='data' id='data'>
        <button type='button' onclick='sendBtn()'>예측</button>
        <br>
        <br>
        <div>입력데이터 : <span id='result'>데이터입력필요</span></div>
        <div>예측무게 : <span id='result2'> 0 </span> g</div>
    </div>


    <!-- 그래프   -->
    <div>
        <canvas id="myChart"></canvas>
    </div>
    <!-- 그래프   -->

    <script>

    </script>

</body>
</html>
